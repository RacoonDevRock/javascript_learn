<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blackjack</title>
    <link rel="stylesheet" href="assets/css/styles.css">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css"
        integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh" crossorigin="anonymous">
</head>

<body>

    <header class="titulo">
        BlackJack
    </header>

    <div class="row mt-2">
        <div id="divBotones" class="col text-center">

            <button id="btnNew" class="btn btn-danger">New game</button>
            <button id="btnGive" disabled="disabled" class="btn btn-primary">Give a card</button>
            <button id="btnStop" disabled="disabled" class="btn btn-primary">Stop game</button>

        </div>
    </div>

    <div class="row container">
        <div class="col">

            <h1>Player 1 - <small>0</small></h1>
            <div id="player-cards" class="divCards">
            </div>

        </div>
    </div>

    <div class="row container mt-2">
        <div class="col">

            <h1>Computer - <small>0</small></h1>
            <div id="computer-cards" class="divCards">
            </div>

        </div>
    </div>

    <script src="assets/js/underscore-umd.js"></script>
    <script src="assets/js/game-min.js"></script>

    <script>
        console.log(myModule);

        document.querySelector("#btnNew").addEventListener('click', () => {
            myModule.newGame();
        })
    </script>
</body>

</html>
